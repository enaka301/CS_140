<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Processing Practice</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

<body>
    <header>
        <h1>Form Processing Practice</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>

    <main>
        <div class="form-container">
            <fieldset>
                <div id="message"></div>
                <form action="formprocessing.html" method="GET" id="signup-form">
                    <div class="form-row">
                        <label for="fullname">Full Name:</label>
                        <input id="fullname" type="text" name="fullname" placeholder="Full Name">
                    </div>
                    <div class="form-row">
                        <label for="email">Email:</label>
                        <input id="email" type="email" name="e-mail" placeholder="Email">
                    </div>
                    <div class="form-row">
                        <label for="age">Age:</label>
                        <input id="age" type="number" name="ageyear">
                    </div>
                    <div class="form-row">
                        <label for="pass">Password:</label>
                        <input id="pass" type="password" name="password" placeholder="Password">
                    </div>
                    <div class="form-row">
                        <label for="bdate">Birthdate:</label>
                        <input id="bdate" type="date" name="bdate">
                    </div>
                    <div class="form-row">
                        <input type="submit">
                    </div>
                </form>
            </fieldset>
        </div>
